<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masuk | Catatan Tugas Kuliah</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef3f7;color:#142b42;font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.card{max-width:440px;width:100%;padding:40px;background:white;border:1px solid #dce4ed;border-radius:18px}small{color:#167d70;letter-spacing:2px;font-weight:700}h1{font-size:30px;margin:18px 0 12px}p{color:#607185;line-height:1.6}label{display:block;font-size:14px;margin-top:20px}input{width:100%;padding:13px;border:1px solid #cbd5df;border-radius:8px;margin-top:7px;font:inherit}button{margin-top:25px;width:100%;padding:14px;border:0;border-radius:8px;background:#167d70;color:white;font:inherit;font-weight:700}.error{background:#fff0ef;padding:12px;color:#a23f39}footer{margin-top:25px;font-size:12px;color:#718297}</style></head>
<body><main class="card"><small>CATATAN / KULIAH</small><h1>Selamat datang kembali.</h1><p>Masuk untuk mengelola tugas dan melihat progres belajarmu.</p>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required maxlength="100"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200"><button>Masuk ke catatan</button></form><footer>Ryan Alfin Saputra · Praktikum Komputasi Awan</footer></main></body></html>
